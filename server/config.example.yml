# GCL Ping Monitor - server configuration
#
# No secrets in here on purpose: passwords and tokens come from .env.
# This file is re-read while running - save it and the change applies on the
# next cycle, without losing ping history or acknowledgements.
#
# Everything below is an example. Nothing here is a real address.

# Shown on the dashboard and at the end of every alert, so you can tell which
# box raised it. Blank = the container's hostname.
monitor_name: MONITOR-01

interval_seconds: 5      # how often every enabled host is pinged
timeout_ms: 1500         # how long to wait for one reply
fail_threshold: 2        # consecutive misses before a host is called DOWN
loss_window: 100         # how many recent pings the Loss % is measured over

web:
  port: 8080
  allow_ack: true        # false makes the dashboard strictly read-only
  allow_edit: true       # the /hosts editor. false = config.yml is the only way

  # Where a phone can reach the dashboard. No token here - it is added at send
  # time - and no trailing slash. Set this and tapping a phone alert opens the
  # dashboard already logged in; leave it blank and the tap goes nowhere.
  public_url: ""

# WHO IS TOLD, AND WHEN
#
# Detection never waits: a host goes DOWN in the table the moment it is called
# DOWN, whatever the numbers below say. What these tune is the interruption.
#
# The shape that works in practice - someone IS at the desk, and the rest of
# the estate is asleep:
#
#   desk (banner + noise)  instant   they are already looking at it
#   Telegram               instant   the record of everything, cheap to ignore
#   phone (ntfy)           60s       only ring a pocket for a real outage
#   email                  60s       an inbox that holds only real outages
#
# The values below are set that way. A link that blips for twenty seconds then
# alarms the desk, appears in Telegram, and reaches nobody's phone or inbox -
# which is the whole point.

# The alarm: the red banner and the noise at the desk.
alarm:
  delay_seconds: 0       # 0 = alarm the moment a host is called DOWN

notify:
  on_down: true
  on_recover: true
  batch_seconds: 20      # events inside this window become ONE message
  max_per_hour: 20       # hard cap, so a flapping link cannot spam
  repeat_min: 5          # re-send while STILL down and un-acknowledged. 0 = once only

  # Every channel has its own `delay_seconds`: how long a host must have been
  # down before THAT channel is told. 0 = immediately.
  #
  # A host that comes back inside its window is never mailed about at all - and
  # neither is its recovery, so you never get a "RECOVERED" for a "DOWN" that
  # was never sent. The same goes for the `repeat_min` reminders below: a
  # channel is only reminded about outages it was actually told about.
  email:
    enabled: false
    smtp_server: mail.example.com
    port: 465
    security: auto       # auto | starttls | ssl | none   (465 = ssl, 587 = starttls)
    user: alerts@example.com
    sender: alerts@example.com
    to: noc@example.com
    delay_seconds: 60    # an inbox that holds only real outages

  telegram:
    enabled: false
    chat_id: ""          # group ids start with -100
    delay_seconds: 0     # the running record: every blip, instantly

  ntfy:
    enabled: false
    server: https://ntfy.sh
    topic: ""            # on the public server the topic name IS the password
    down_priority: 5     # 5 = urgent: rings through Do Not Disturb
    up_priority: 3       # a recovery at 5 would wake you at 3am to say all is well
    click_url: ""        # tapping the phone notification opens this
    # This is the one people get wrong. `alarm.delay_seconds` is the noise at
    # the DESK; the sound coming out of a phone is this channel arriving at
    # priority 5. Delaying the alarm does nothing to the phone - delay ntfy.
    delay_seconds: 60    # only ring a pocket for an outage that is still down

# THE LAYERS OF THE NETWORK
#
# This list is the hierarchy: upstream at the top, the edge at the bottom, and
# the dashboard draws the groups in exactly this order. So re-ordering these
# lines re-orders the dashboard - which is why the order lives here and not in
# whatever sequence somebody happened to add routers in.
#
# A layer with something wrong is lifted above the healthy ones, and with
# "Focus" on the healthy layers fold away while that lasts. Nothing is hidden:
# every heading carries its own count, and the banner is always the whole
# estate.
#
# Hosts with no group land under "Ungrouped" at the bottom. That name is
# reserved - a host cannot join it, it is just where "not said yet" is drawn.
groups:
  - UPSTREAM_PEER
  - CORE_RTR
  - CORE_SWITCH
  - NAT_RTR
  - ACCESS_RTR
  - POP_RTR

# The host list. Editable from a browser at /hosts - saving there rewrites this
# block and leaves every comment in this file alone.
#
# label   what you call it
# target  IP or hostname to ping
# group   which layer above it sits on. Presentation only: it never changes
#         what is pinged, when it alarms, or who is told.
# enabled false = not pinged at all, shown greyed out, can never alarm
# sound   false = no NOISE at the desk. It still goes red, still needs an
#         acknowledgement, and it still sends its notifications.
hosts:
  - label: GATEWAY
    target: 192.0.2.1
    group: UPSTREAM_PEER
  - label: CORE_SWITCH
    target: 192.0.2.2
    group: CORE_SWITCH
  - label: UPS_INPUT_POWER
    target: 192.0.2.10
  - label: PUBLIC_CHECK
    target: google.com
    sound: false
  - label: DECOMMISSIONED_VM
    target: 192.0.2.99
    enabled: false

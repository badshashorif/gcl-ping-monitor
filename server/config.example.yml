# GCL Ping Monitor - server configuration
#
# No secrets in here on purpose: passwords and tokens come from .env.
# This file is re-read while running - save it and the change applies on the
# next cycle, without losing ping history or acknowledgements.
#
# Everything below is an example. Nothing here is a real address.

# Shown on the dashboard and at the end of every alert, so you can tell which
# box raised it. Blank = the container's hostname.
monitor_name: MONITOR-01

interval_seconds: 5      # how often every enabled host is pinged
timeout_ms: 1500         # how long to wait for one reply
fail_threshold: 2        # consecutive misses before a host is called DOWN
loss_window: 100         # how many recent pings the Loss % is measured over

web:
  port: 8080
  allow_ack: true        # false makes the dashboard strictly read-only
  allow_edit: true       # the /hosts editor. false = config.yml is the only way

  # Where a phone can reach the dashboard. No token here - it is added at send
  # time - and no trailing slash. Set this and tapping a phone alert opens the
  # dashboard already logged in; leave it blank and the tap goes nowhere.
  public_url: ""

# The alarm is the red banner and the noise at the desk. This is how long a
# host has to STAY down before it goes off. The table still shows the host down
# immediately, and the phone channels below can still be told immediately - the
# delay only holds back the interruption, so a link that blips for a few
# seconds does not empty the room.
alarm:
  delay_seconds: 0       # 0 = alarm the moment a host is called DOWN

notify:
  on_down: true
  on_recover: true
  batch_seconds: 20      # events inside this window become ONE message
  max_per_hour: 20       # hard cap, so a flapping link cannot spam
  repeat_min: 5          # re-send while STILL down and un-acknowledged. 0 = once only

  # Every channel has its own `delay_seconds`: how long a host must have been
  # down before THAT channel is told. 0 = immediately.
  #
  # This is what separates a nudge from an escalation. Leave ntfy and Telegram
  # at 0 so the on-call phone knows within seconds, and put a delay on email so
  # the inbox only ever holds real outages. A host that comes back inside its
  # window is never mailed about at all - and neither is its recovery, so you
  # never get a "RECOVERED" for a "DOWN" that was never sent.
  email:
    enabled: false
    smtp_server: mail.example.com
    port: 465
    security: auto       # auto | starttls | ssl | none   (465 = ssl, 587 = starttls)
    user: alerts@example.com
    sender: alerts@example.com
    to: noc@example.com
    delay_seconds: 0

  telegram:
    enabled: false
    chat_id: ""          # group ids start with -100
    delay_seconds: 0

  ntfy:
    enabled: false
    server: https://ntfy.sh
    topic: ""            # on the public server the topic name IS the password
    down_priority: 5     # 5 = urgent: rings through Do Not Disturb
    up_priority: 3       # a recovery at 5 would wake you at 3am to say all is well
    click_url: ""        # tapping the phone notification opens this
    delay_seconds: 0

# The host list. Editable from a browser at /hosts - saving there rewrites this
# block and leaves every comment in this file alone.
#
# label   what you call it
# target  IP or hostname to ping
# enabled false = not pinged at all, shown greyed out, can never alarm
# sound   false = no NOISE at the desk. It still goes red, still needs an
#         acknowledgement, and it still sends its notifications.
hosts:
  - label: GATEWAY
    target: 192.0.2.1
  - label: CORE_SWITCH
    target: 192.0.2.2
  - label: UPS_INPUT_POWER
    target: 192.0.2.10
  - label: PUBLIC_CHECK
    target: google.com
    sound: false
  - label: DECOMMISSIONED_VM
    target: 192.0.2.99
    enabled: false

# Self-hosted ntfy for the GCL Ping Monitor phone alarm.
#
# ntfy only. It sits behind a Caddy that already exists on the host and joins
# that stack's network from the outside - the same shape as the ping monitor's
# own compose project, and for the same reason: nothing here can break the
# services already running there, and `docker compose down` in this directory
# cannot take them with it.
#
# Nothing is published on the host. Caddy is the only thing facing the world,
# and it reaches this by container name. Run ./add-caddy-site.sh to add the
# site block - it carries proxy settings that ntfy specifically needs.
#
# Why self-hosted at all: on the public ntfy.sh the topic name is the only
# thing protecting the alerts, every outage message passes through a third
# party, and so does the dashboard link - token included.

services:
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: gcl-ntfy
    restart: unless-stopped
    command: serve
    # No "user:" here on purpose. Docker creates a named volume owned by root,
    # so pinning the container to uid 1000 would leave ntfy unable to write
    # cache.db or auth.db - and it fails at that quietly enough to look like a
    # config problem.
    environment:
      # Behind a proxy, so ntfy must NOT try to do its own TLS, and it has to
      # trust the forwarded client IP or every visitor looks like the proxy and
      # the rate limiter treats them all as one abusive client.
      - NTFY_BASE_URL=https://${NTFY_DOMAIN}
      - NTFY_LISTEN_HTTP=:80
      - NTFY_BEHIND_PROXY=true
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_CACHE_DURATION=48h
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      # deny-all: the topic name is then no longer the only thing protecting
      # the alerts. Without this, anyone who guesses the topic can read every
      # outage message and publish fake ones.
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_ENABLE_SIGNUP=false
      - NTFY_ENABLE_LOGIN=true
      - NTFY_ATTACHMENT_CACHE_DIR=/var/cache/ntfy/attachments
      - NTFY_LOG_LEVEL=info
      - TZ=${TZ:-Asia/Dhaka}
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
    networks: [proxy_net]
    healthcheck:
      # /v1/health is ntfy's own endpoint (server.go: apiHealthPath). Checking
      # for HTTP 200 rather than grepping the JSON body, so a change to the
      # field name in some future release cannot silently mark it unhealthy.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/v1/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy_net:
    external: true
    # The network the host's existing Caddy is on. VERIFY IT FIRST:
    #   docker network ls
    # On monitor.grameencybernet.net it is plain "monitor_net" - NOT
    # "monitoring-stack_monitor_net", which is what Compose's usual project
    # prefixing would lead you to expect. deploy.sh detects it.
    name: ${NTFY_NET_NAME:-monitor_net}

volumes:
  ntfy_cache:
  ntfy_data:
